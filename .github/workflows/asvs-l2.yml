name: Kaizen ASVS L2 assurance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: kaizen-asvs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Go unit + integration
        run: go test ./... -count=1
      - name: Go race detector
        run: go test -race ./... -count=1
      - name: Go vet and build
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/kaizen" ./cmd/kaizen
      - name: HR source preflight regression (no PII)
        run: python3 -m unittest discover -s tools -p 'test_p0_hr_preflight.py'
      - name: Go single-binary packaging skill smoke test
        run: python3 -m unittest discover -s skills/go-single-binary/tests -v
      - name: Package real Kaizen main package for Windows amd64
        run: |
          python3 skills/go-single-binary/scripts/package_go.py build \
            --project-root . --package ./cmd/kaizen --name kaizen \
            --version "ci-${GITHUB_SHA}" --target windows/amd64 --cgo 0
          python3 skills/go-single-binary/scripts/package_go.py verify "dist/kaizen_ci-${GITHUB_SHA}_windows_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kaizen-windows-amd64-ci
          path: dist/*.zip
          if-no-files-found: error
      - name: ASVS L2 baseline integrity
        run: |
          python3 tools/asvs_report.py
          python3 tools/asvs_report.py --csv asvs-review.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asvs-level2-review
          path: asvs-review.csv
          retention-days: 30
  vulnerability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
