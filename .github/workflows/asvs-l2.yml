name: Kaizen ASVS L2 assurance
on:
  push:
    branches: [main, 'security/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit + integration
        run: go test ./... -count=1
      - name: Go race detector
        run: go test -race ./... -count=1
      - name: Go vet and build
        run: |
          go vet ./...
          go build ./cmd/kaizen
      - name: ASVS L2 baseline integrity
        run: |
          python3 tools/asvs_report.py
          python3 tools/asvs_report.py --csv asvs-review.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asvs-level2-review
          path: asvs-review.csv
          retention-days: 30
  vulnerability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
